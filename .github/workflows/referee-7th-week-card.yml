name: Build ZO 7th Week Referees News Card
on:
  push:
    paths:
      - '.github/workflows/referee-7th-week-card.yml'
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install pillow
      - name: Generate accurate editorial list graphic
        run: |
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math, os
          W,H=1200,1720
          img=Image.new('RGB',(W,H),(6,9,15));d=ImageDraw.Draw(img)
          red='#ee2437';white='#f6f6f7';muted='#a8b1c1';panel='#111822'
          root='/usr/share/fonts/truetype/dejavu/'
          def ft(n,b=True): return ImageFont.truetype(root+('DejaVuSans-Bold.ttf' if b else 'DejaVuSans.ttf'),n)
          # fine-grained data-grid background
          for x in range(0,W,42): d.line((x,0,x,H),fill='#0e131b',width=1)
          for y in range(0,H,42): d.line((0,y,W,y),fill='#0e131b',width=1)
          d.rectangle((0,0,W,12),fill=red)
          d.rectangle((0,0,14,H),fill=red)
          # brand mark: Z + ascending arrow and circular clock exactly as approved motif
          d.ellipse((58,55,270,267),outline=red,width=8)
          d.text((84,91),'Z',font=ft(132),fill=white)
          d.polygon([(143,174),(181,123),(197,132),(233,82),(223,119),(204,107),(162,187)],fill=red)
          d.ellipse((174,133,245,204),fill='#070c12',outline=white,width=9)
          d.arc((185,144,235,194),220,340,fill=red,width=6)
          d.line((209,168,220,153),fill=white,width=4); d.line((209,168,224,179),fill=white,width=4)
          d.ellipse((204,163,214,173),fill=red)
          d.text((60,272),'@zamanveoran',font=ft(23,False),fill=white)
          # title
          d.text((308,72),'SÜPER LİG',font=ft(91),fill=white)
          d.rectangle((312,190,1125,251),fill='#d11b30')
          d.text((332,195),'7. HAFTA  |  HAKEM ATAMALARI',font=ft(37),fill=white)
          d.text((315,270),'9-12 EKİM 2026  /  9 MAÇ  /  9 ORTA HAKEM',font=ft(22,False),fill=muted)
          d.line((63,333,1137,333),fill=red,width=3)
          rows=[
           ('CUMA 09.10','20:00','GALATASARAY - KASIMPAŞA','HALİL UMUT MELER',True),
           ('CMT 10.10','13:30','GENÇLERBİRLİĞİ - AMED','ÜMİT ÖZTÜRK',False),
           ('CMT 10.10','16:00','ALANYASPOR - ERZURUMSPOR','DAVUT DAKUL ÇELİK',False),
           ('CMT 10.10','16:00','SAMSUNSPOR - TRABZONSPOR','OĞUZHAN ÇAKIR',True),
           ('CMT 10.10','19:00','RİZESPOR - FENERBAHÇE','OZAN ERGÜN',True),
           ('PAZ 11.10','13:30','KONYASPOR - BAŞAKŞEHİR','BATUHAN KOLAK',False),
           ('PAZ 11.10','16:00','GAZİANTEP FK - ÇORUM FK','GÜRCAN HASOVA',False),
           ('PAZ 11.10','19:00','BEŞİKTAŞ - KOCAELİSPOR','ABDULLAH BUĞRA TAŞKINSOY',True),
           ('PZT 12.10','20:00','EYÜPSPOR - GÖZTEPE','ATİLLA KARAOĞLAN',False)
          ]
          for i,(date,time,match,ref,feature) in enumerate(rows):
              top=353+i*142
              d.rounded_rectangle((60,top,1145,top+127),radius=21,fill=panel,outline=red if feature else '#354352',width=3 if feature else 2)
              if feature: d.rounded_rectangle((63,top+3,73,top+124),radius=4,fill=red)
              d.text((100,top+16),f'{date}  •  {time}',font=ft(23,False),fill='#ff6678' if feature else muted)
              sz=31
              while d.textbbox((0,0),match,font=ft(sz))[2]>618 and sz>19:sz-=1
              d.text((99,top+58),match,font=ft(sz),fill=white)
              d.line((747,top+18,747,top+107),fill='#3a4657',width=2)
              d.text((774,top+16),'ORTA HAKEM',font=ft(19,False),fill=muted)
              sz=30
              while d.textbbox((0,0),ref,font=ft(sz))[2]>348 and sz>19:sz-=1
              d.text((774,top+61),ref,font=ft(sz),fill=white)
          y=1643
          d.line((60,y,1144,y),fill=red,width=3)
          d.text((65,1662),'KAYNAK: A HABER  |  FİKSTÜR: ANADOLU AJANSI',font=ft(20,False),fill=muted)
          d.text((1020,1662),'Z / O',font=ft(22),fill=red)
          os.makedirs('images',exist_ok=True)
          img.save('images/super-lig-7-hafta-hakemleri-20261008.png', optimize=True)
          print('CREATED_BRANDED_PNG',os.stat('images/super-lig-7-hafta-hakemleri-20261008.png').st_size)
      - name: Commit the new media asset
        run: |
          git config user.name "zamanveoran-gorsel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/super-lig-7-hafta-hakemleri-20261008.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish 7th week referees accurate branded list image"
            git push
          fi
