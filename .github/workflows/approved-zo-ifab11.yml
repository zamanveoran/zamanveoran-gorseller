name: Approved ZO IFAB Law 11 Graphic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - name: Render educational football law graphic
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          im=Image.new("RGB",(1400,900),(10,14,22));d=ImageDraw.Draw(im)
          f=lambda s:ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",s)
          logo=Image.open("images/zamanveoran-onayli-logo.png").convert("RGB")
          logo.thumbnail((440,440));im.paste(logo,(55,190))
          d=ImageDraw.Draw(im);r=(240,45,59)
          d.rectangle((0,0,1400,14),fill=r)
          d.text((530,115),"KURAL 11 | OFSAYT",font=f(50),fill=r)
          d.text((530,235),"ÇİZGİDE OLMAK",font=f(58),fill="white")
          d.text((530,315),"OFSAYT DEĞİL",font=f(58),fill="white")
          d.line((530,420,1300,420),fill=r,width=5)
          for i,t in enumerate(("Rakiple aynı hizada olmak","tek başına ofsayt değildir.","Aktif oyuna katılım da önemlidir.")):
              d.text((535,465+78*i),t,font=f(30),fill=(223,230,237))
          d.text((80,810),"@zamanveoran",font=f(35),fill="white")
          im.save("images/zo-ifab-kural11-20261008.png",format="PNG")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/zo-ifab-kural11-20261008.png
          git commit -m "Publish IFAB law 11 visual with approved ZO logo"
          git push
